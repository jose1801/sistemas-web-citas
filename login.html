<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Iniciar sesión · Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">A</div>
      <h1 class="login-brand-title">Agenda</h1>
      <div class="login-brand-subtitle">Inicia sesión para gestionar tus citas</div>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-input" type="email" id="email" autocomplete="username" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="password-field">
          <input class="form-input" type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="password-toggle" id="toggle-password">Mostrar</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-submit" id="login-submit">
        <div class="spinner hidden"></div>
        <span class="btn-text">Iniciar sesión</span>
      </button>
    </form>

    <div class="login-footer">Acceso exclusivo para la administradora del negocio.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
